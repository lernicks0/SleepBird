name: Build SleepBird for Windows users

on:
  push:
    branches: [main]
    paths:
      - 'SleepBird/**'
      - 'SleepBirdTests/**'
      - 'SleepBird.xcodeproj/**'
      - 'scripts/build_cloud.py'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run XCTest on an available iPhone simulator before packaging
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sleepbird-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests and build unsigned device IPA
        env:
          RUN_TESTS: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: python3 scripts/build_cloud.py

      - name: Downloadable build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepBird-iOS-${{ github.run_number }}
          path: .ci-output/
          if-no-files-found: error
          retention-days: 7
